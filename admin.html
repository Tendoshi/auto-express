<!DOCTYPE html>
<html lang="fr" class="bg-[#070a0f] text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Express | Espace Administration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Raleway', sans-serif; }
        .font-heading { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body class="p-6 max-w-6xl mx-auto">

    <!-- ÉCRAN DE CONNEXION SÉCURISÉ (FIREBASE AUTH) -->
    <div id="login-screen" class="min-h-[80vh] flex items-center justify-center">
        <div class="bg-[#0e131d] border border-white/10 p-8 rounded-2xl w-full max-w-md text-center">
            <h1 class="text-xl font-bold uppercase tracking-widest text-white mb-6 font-heading">
                AUTO <span class="text-white/50">| ADMIN SÉCURISÉ</span>
            </h1>
            <form onsubmit="loginAdmin(event)" class="space-y-4">
                <input type="email" id="admin-email" required placeholder="Ton e-mail admin" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-xs text-white focus:outline-none focus:border-amber-500">
                <input type="password" id="admin-password" required placeholder="Mot de passe" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-xs text-white focus:outline-none focus:border-amber-500">
                <button type="submit" class="w-full py-3 bg-white text-black font-bold text-xs uppercase tracking-widest rounded-lg hover:bg-white/90 transition-all">
                    Se connecter
                </button>
            </form>
            <p id="auth-error" class="text-red-500 text-xs mt-3 hidden">E-mail ou mot de passe incorrect !</p>
        </div>
    </div>

    <!-- PANNEAU DE CONTRÔLE -->
    <div id="admin-panel" class="hidden space-y-12">
        <div class="flex items-center justify-between border-b border-white/10 pb-6">
            <div>
                <h1 class="text-2xl font-bold uppercase tracking-widest font-heading">Panneau de Contrôle</h1>
                <p class="text-xs text-white/50 mt-1">Ajoute, modifie ou supprime des véhicules de ton catalogue.</p>
            </div>
            <button onclick="logout()" class="px-4 py-2 border border-white/20 text-xs uppercase tracking-wider rounded hover:bg-white/10">Déconnexion</button>
        </div>

        <div class="bg-[#0e131d] border border-white/10 p-6 rounded-2xl">
            <h2 id="form-title" class="text-sm font-bold uppercase tracking-wider text-amber-400 mb-6 font-heading">➕ Ajouter un véhicule</h2>
            
            <form id="add-car-form" onsubmit="saveCar(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                <input type="hidden" id="editing-car-id" value="">
                <input type="hidden" id="editing-car-created-at" value="">

                <div>
                    <label class="block text-white/50 mb-1">Marque</label>
                    <input type="text" id="car-brand" required placeholder="ex: Mercedes" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-white">
                </div>
                <div>
                    <label class="block text-white/50 mb-1">Modèle</label>
                    <input type="text" id="car-model" required placeholder="ex: GLE Coupe" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-white">
                </div>
                <div>
                    <label class="block text-white/50 mb-1">Année</label>
                    <input type="text" id="car-year" placeholder="ex: 2023" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-white">
                </div>

                <div>
                    <label class="block text-white/50 mb-1">Catégorie</label>
                    <select id="car-category" class="w-full bg-[#0e131d] border border-white/10 rounded px-3 py-2 text-white">
                        <option value="SUV">SUV</option>
                        <option value="Berline">Berline</option>
                        <option value="Sport">Sport</option>
                        <option value="Pick-up">Pick-up</option>
                    </select>
                </div>

                <div>
                    <label class="block text-white/50 mb-1">Carburant / Propulsion</label>
                    <select id="car-fuel" class="w-full bg-[#0e131d] border border-white/10 rounded px-3 py-2 text-white">
                        <option value="Essence">Essence</option>
                        <option value="Diesel">Diesel</option>
                        <option value="Électrique">Électrique</option>
                        <option value="Hybride">Hybride</option>
                    </select>
                </div>

                <div>
                    <label class="block text-white/50 mb-1">Architecture / Cylindres</label>
                    <select id="car-cylinders" class="w-full bg-[#0e131d] border border-white/10 rounded px-3 py-2 text-white">
                        <option value="">-- Non spécifié --</option>
                        <option value="3 Cylindres">3 Cylindres</option>
                        <option value="4 Cylindres">4 Cylindres</option>
                        <option value="6 Cylindres">6 Cylindres</option>
                        <option value="V6">V6</option>
                        <option value="V8">V8</option>
                        <option value="V12">V12</option>
                        <option value="Autre / Non spécifié">Autre / Non spécifié</option>
                    </select>
                </div>

                <div>
                    <label class="block text-white/50 mb-1">Boîte de vitesse</label>
                    <select id="car-trans" class="w-full bg-[#0e131d] border border-white/10 rounded px-3 py-2 text-white">
                        <option value="Automatique">Automatique</option>
                        <option value="Manuelle">Manuelle</option>
                    </select>
                </div>

                <div>
                    <label class="block text-white/50 mb-1">Kilométrage</label>
                    <input type="text" id="car-km" placeholder="ex: 12 000 km" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-white">
                </div>

                <div>
                    <label class="block text-white/50 mb-1">Démarrage</label>
                    <select id="car-start" class="w-full bg-[#0e131d] border border-white/10 rounded px-3 py-2 text-white">
                        <option value="Start/Stop">Start / Stop (Bouton)</option>
                        <option value="Clé">Démarrage à clé</option>
                    </select>
                </div>

                <div>
                    <label class="block text-white/50 mb-1">Climatisation</label>
                    <select id="car-ac" class="w-full bg-[#0e131d] border border-white/10 rounded px-3 py-2 text-white">
                        <option value="Oui">Climatisé</option>
                        <option value="Non">Non climatisé</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] uppercase font-bold text-white/40 mb-2 tracking-widest">Véhicule importé</label>
                    <select id="car-imported" class="w-full bg-[#131924] border border-white/10 rounded-lg px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/40">
                        <option value="Oui">Oui</option>
                        <option value="Non">Non</option>
                    </select>
                </div>

                <div>
                    <label class="block text-white/50 mb-1">Papiers</label>
                    <select id="car-papers" class="w-full bg-[#0e131d] border border-white/10 rounded px-3 py-2 text-white">
                        <option value="Oui">Tous papiers à jour</option>
                        <option value="Non">Papiers non à jour</option>
                    </select>
                </div>

                <div>
                    <label class="block text-amber-400 font-bold mb-1">Type d'offre</label>
                    <select id="car-offer-type" onchange="togglePriceFields()" class="w-full bg-[#0e131d] border border-amber-500/50 rounded px-3 py-2 text-amber-400 font-bold">
                        <option value="both">Vente ET Location</option>
                        <option value="vente">Vente uniquement</option>
                        <option value="location">Location uniquement</option>
                    </select>
                </div>

                <div id="field-price-vente">
                    <label class="block text-white/50 mb-1">Prix Vente (FCFA)</label>
                    <input type="text" id="car-price-vente" placeholder="ex: 35 000 000" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-white">
                </div>
                <div id="field-price-loc">
                    <label class="block text-white/50 mb-1">Prix Location (FCFA / jour)</label>
                    <input type="text" id="car-price-loc" placeholder="ex: 80 000" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-white">
                </div>

                <!-- Champ Statut de Location (disponible ou réservé) -->
                <div>
                    <label class="block text-emerald-400 font-bold mb-1">Statut de Disponibilité (Location)</label>
                    <select id="car-rental-status" class="w-full bg-[#0e131d] border border-emerald-500/50 rounded px-3 py-2 text-emerald-400 font-bold">
                        <option value="available">🟢 Disponible</option>
                        <option value="booked">🟡 En location</option>
                    </select>
                </div>

                <div class="md:col-span-3 bg-white/5 p-3 rounded-lg border border-white/10 grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-white/70 mb-1">Nom du sous-dossier dans <code>images/</code></label>
                        <input type="text" id="car-folder" placeholder="ex: mercedes-gle" class="w-full bg-[#070a0f] border border-white/10 rounded px-3 py-2 text-white">
                    </div>
                    <div>
                        <label class="block text-white/70 mb-1">Nombre total de photos (1.jpg, 2.jpg...)</label>
                        <input type="number" id="car-photo-count" min="1" max="50" placeholder="ex: 12" class="w-full bg-[#070a0f] border border-white/10 rounded px-3 py-2 text-white">
                    </div>
                </div>

                <div class="md:col-span-3 pt-2 flex gap-3">
                    <button type="submit" id="submit-btn" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 font-bold uppercase tracking-widest text-xs rounded transition-all">
                        Enregistrer le véhicule
                    </button>
                    <button type="button" id="cancel-edit-btn" onclick="cancelEdit()" class="hidden px-6 py-3 bg-gray-600 hover:bg-gray-500 font-bold uppercase tracking-widest text-xs rounded transition-all text-white">
                        Annuler
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-[#0e131d] border border-white/10 p-6 rounded-2xl">
            <h2 class="text-sm font-bold uppercase tracking-wider text-white mb-6 font-heading">📋 Véhicules en ligne</h2>
            <div id="admin-car-list" class="space-y-3"></div>
        </div>
    </div>

    <!-- SDKs Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // Connexion sécurisée via Firebase Auth
        async function loginAdmin(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            const errorEl = document.getElementById('auth-error');

            try {
                await firebase.auth().signInWithEmailAndPassword(email, password);
                
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                togglePriceFields();
                renderAdminCars();
            } catch (error) {
                console.error("Erreur de connexion :", error);
                errorEl.textContent = "Accès refusé : e-mail ou mot de passe incorrect.";
                errorEl.classList.remove('hidden');
            }
        }

        function logout() {
            firebase.auth().signOut().then(() => {
                location.reload();
            }).catch((error) => {
                console.error("Erreur de déconnexion", error);
                location.reload();
            });
        }

        function togglePriceFields() {
            const offerType = document.getElementById('car-offer-type').value;
            const venteInput = document.getElementById('car-price-vente');
            const locInput = document.getElementById('car-price-loc');

            if (offerType === 'vente') {
                venteInput.required = true;
                locInput.required = false;
                locInput.parentElement.classList.add('opacity-30');
                venteInput.parentElement.classList.remove('opacity-30');
            } else if (offerType === 'location') {
                locInput.required = true;
                venteInput.required = false;
                locInput.parentElement.classList.add('opacity-30');
                locInput.parentElement.classList.remove('opacity-30');
            } else {
                venteInput.required = true;
                locInput.required = true;
                venteInput.parentElement.classList.remove('opacity-30');
                locInput.parentElement.classList.remove('opacity-30');
            }
        }

        async function renderAdminCars() {
            const list = document.getElementById('admin-car-list');
            list.innerHTML = '<p class="text-white/50 text-xs">Chargement depuis Firebase...</p>';

            try {
                const snapshot = await db.collection('cars').get();
                list.innerHTML = '';

                if (snapshot.empty) {
                    list.innerHTML = '<p class="text-white/40 text-xs">Aucun véhicule enregistré sur Firebase.</p>';
                    return;
                }

                snapshot.forEach(doc => {
                    const car = { id: doc.id, ...doc.data() };
                    const item = document.createElement('div');
                    item.className = 'flex items-center justify-between p-4 bg-white/5 border border-white/10 rounded-xl text-xs gap-4';
                    
                    let offerLabel = '';
                    if (car.offerType === 'vente') offerLabel = '<span class="text-emerald-400 font-bold">[VENTE SEULE]</span>';
                    else if (car.offerType === 'location') offerLabel = '<span class="text-amber-400 font-bold">[LOCATION SEULE]</span>';
                    else offerLabel = '<span class="text-blue-400 font-bold">[VENTE & LOCATION]</span>';

                    const statusBadge = car.rentalStatus === 'booked' 
                        ? '<span class="text-amber-400 font-semibold">🟡 Réservé</span>' 
                        : '<span class="text-emerald-400 font-semibold">🟢 Disponible</span>';

                    const firstImg = (car.images && car.images.length > 0) ? car.images[0] : '';
                    const imgCount = car.images ? car.images.length : 0;
                    
                    const fuelText = car.fuel || 'Essence';
                    const cylText = car.cylinders ? ` (${car.cylinders})` : '';
                    const fuelDisplay = `${fuelText}${cylText}`;

                    item.innerHTML = `
                        <div class="flex items-center gap-4">
                            <img src="${firstImg}" class="w-12 h-12 object-cover rounded bg-black/40" alt="${car.brand}" onerror="this.src='https://via.placeholder.com/80?text=Auto'">
                            <div>
                                <strong class="text-white block text-sm">${car.brand} ${car.model} (${car.year || 'N/A'}) ${offerLabel}</strong>
                                <span class="text-white/50">${car.category || 'SUV'} - Moteur: ${fuelDisplay} | Statut: ${statusBadge} | Vente: ${car.priceVente || 'N/A'} | ${imgCount} photo(s)</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="editCar('${car.id}')" class="px-3 py-1.5 bg-amber-600/80 hover:bg-amber-600 text-white font-bold rounded uppercase tracking-wider text-[10px] transition-all">
                                Modifier
                            </button>
                            <button onclick="deleteCar('${car.id}')" class="px-3 py-1.5 bg-red-600/80 hover:bg-red-600 text-white font-bold rounded uppercase tracking-wider text-[10px] transition-all">
                                Supprimer
                            </button>
                        </div>
                    `;
                    list.appendChild(item);
                });

            } catch (error) {
                console.error("Erreur lors du chargement :", error);
                list.innerHTML = '<p class="text-red-400 text-xs">Erreur lors de la récupération des données.</p>';
            }
        }

        async function editCar(carId) {
            try {
                const doc = await db.collection('cars').doc(carId).get();
                if (!doc.exists) return;

                const car = doc.data();

                document.getElementById('editing-car-id').value = carId;
                document.getElementById('editing-car-created-at').value = car.createdAt || Date.now();
                document.getElementById('car-brand').value = car.brand || '';
                document.getElementById('car-model').value = car.model || '';
                document.getElementById('car-year').value = car.year || '';
                document.getElementById('car-category').value = car.category || 'SUV';
                
                document.getElementById('car-fuel').value = car.fuel || 'Essence';
                document.getElementById('car-cylinders').value = car.cylinders || '';

                document.getElementById('car-trans').value = car.transmission || 'Automatique';
                document.getElementById('car-km').value = car.km || '';
                document.getElementById('car-start').value = car.startType || 'Start/Stop';
                document.getElementById('car-ac').value = car.airConditioning || 'Oui';
                document.getElementById('car-imported').value = car.isImported || 'Oui';
                document.getElementById('car-papers').value = car.papersOk || 'Oui';
                document.getElementById('car-offer-type').value = car.offerType || 'both';
                document.getElementById('car-rental-status').value = car.rentalStatus || 'available';

                togglePriceFields();

                document.getElementById('car-price-vente').value = car.priceVente || '';
                document.getElementById('car-price-loc').value = car.priceLocation || '';

                if (car.images && car.images.length > 0) {
                    const parts = car.images[0].split('/');
                    if (parts.length >= 2) {
                        document.getElementById('car-folder').value = parts[1];
                    }
                    document.getElementById('car-photo-count').value = car.images.length;
                }

                document.getElementById('form-title').innerText = '✏️ Modifier le véhicule';
                const submitBtn = document.getElementById('submit-btn');
                submitBtn.innerText = 'Mettre à jour le véhicule';
                submitBtn.className = 'flex-1 py-3 bg-amber-600 hover:bg-amber-500 font-bold uppercase tracking-widest text-xs rounded transition-all';
                document.getElementById('cancel-edit-btn').classList.remove('hidden');

                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (error) {
                console.error("Erreur lors de la récupération :", error);
                alert("Impossible de charger les données du véhicule.");
            }
        }

        function cancelEdit() {
            document.getElementById('editing-car-id').value = '';
            document.getElementById('editing-car-created-at').value = '';
            document.getElementById('add-car-form').reset();
            document.getElementById('car-rental-status').value = 'available';
            togglePriceFields();

            document.getElementById('form-title').innerText = '➕ Ajouter un véhicule';
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = 'Enregistrer le véhicule';
            submitBtn.className = 'flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 font-bold uppercase tracking-widest text-xs rounded transition-all';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        async function saveCar(e) {
            e.preventDefault();

            const editingId = document.getElementById('editing-car-id').value;
            const existingCreatedAt = document.getElementById('editing-car-created-at').value;
            
            const folderName = document.getElementById('car-folder').value.trim();
            const photoCount = parseInt(document.getElementById('car-photo-count').value) || 0;

            const imagesArray = [];
            if (folderName && photoCount > 0) {
                for (let i = 1; i <= photoCount; i++) {
                    imagesArray.push(`images/${folderName}/${i}.jpg`);
                }
            }

            const offerType = document.getElementById('car-offer-type').value;
            const carId = editingId ? editingId : 'car-' + Date.now();
            const createdAtValue = editingId && existingCreatedAt ? Number(existingCreatedAt) : Date.now();

            const carData = {
                id: carId,
                createdAt: createdAtValue,
                brand: document.getElementById('car-brand').value.trim(),
                model: document.getElementById('car-model').value.trim(),
                year: document.getElementById('car-year').value.trim(),
                category: document.getElementById('car-category').value,
                fuel: document.getElementById('car-fuel').value,
                cylinders: document.getElementById('car-cylinders').value,
                transmission: document.getElementById('car-trans').value,
                km: document.getElementById('car-km').value.trim(),
                startType: document.getElementById('car-start').value,
                airConditioning: document.getElementById('car-ac').value,
                isImported: document.getElementById('car-imported').value,
                papersOk: document.getElementById('car-papers').value,
                offerType: offerType,
                rentalStatus: document.getElementById('car-rental-status').value,
                priceVente: document.getElementById('car-price-vente').value.trim() || null,
                priceLocation: document.getElementById('car-price-loc').value.trim() || null,
                images: imagesArray
            };

            try {
                await db.collection('cars').doc(carId).set(carData, { merge: true });
                cancelEdit();
                await renderAdminCars();
                alert(editingId ? 'Véhicule mis à jour avec succès !' : 'Véhicule enregistré avec succès sur Firebase !');
            } catch (error) {
                console.error("Erreur lors de l'enregistrement :", error);
                alert("Erreur lors de l'enregistrement du véhicule.");
            }
        }

        async function deleteCar(carId) {
            if (confirm('Es-tu sûr de vouloir supprimer ce véhicule ?')) {
                try {
                    await db.collection('cars').doc(carId).delete();
                    if (document.getElementById('editing-car-id').value === carId) {
                        cancelEdit();
                    }
                    await renderAdminCars();
                } catch (error) {
                    console.error("Erreur lors de la suppression :", error);
                    alert("Erreur lors de la suppression.");
                }
            }
        }
    </script>
</body>
</html>
